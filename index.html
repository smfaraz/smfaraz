<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
    
    <title>ClinicConnect | Enterprise Clinical OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              // PROFESSIONAL SLATE/BLUE PALETTE
              brand: {
                50: '#f8fafc',  // Very light slate
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#2563eb', // Primary Blue (Action)
                700: '#1d4ed8', // Darker Blue
                800: '#1e293b', // Dark Slate
                900: '#0f172a', // Deepest Slate (Black replacement)
                950: '#020617',
              },
            },
            boxShadow: {
              'pro': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
              'pro-lg': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)',
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
      
      /* SUBTLE PRO GRADIENT BACKGROUND */
      .pro-bg {
        position: fixed; inset: 0; z-index: -1;
        background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08), transparent 40%),
                    radial-gradient(circle at 80% 10%, rgba(37, 99, 235, 0.05), transparent 40%),
                    radial-gradient(circle at 0% 100%, rgba(37, 99, 235, 0.05), transparent 40%);
      }
      .dark .pro-bg {
        background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15), transparent 50%);
      }

      /* PROFESSIONAL CARD STYLES */
      .glass-panel { 
        background: rgba(255, 255, 255, 0.7); 
        backdrop-filter: blur(20px); 
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .dark .glass-panel { 
        background: rgba(15, 23, 42, 0.7); 
        border: 1px solid rgba(51, 65, 85, 0.5);
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 dark:bg-[#0b1120] text-slate-900 dark:text-slate-100">
    <div class="pro-bg"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
