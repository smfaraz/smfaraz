
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicConnect AI | Ultra Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Outfit', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
                400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
                800: '#5b21b6', 900: '#4c1d95', 950: '#2e1065',
              },
            }
          }
        }
      }
    </script>
    <style>
      :root { --glass-blur: 40px; }
      body { font-family: 'Outfit', sans-serif; transition: background-color 0.8s ease; overflow-x: hidden; }
      
      /* BACKGROUND AURORA */
      .aurora-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
      .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 20s infinite alternate; }
      .blob-1 { width: 500px; height: 500px; background: #8b5cf6; top: -10%; left: -10%; }
      .blob-2 { width: 600px; height: 600px; background: #ec4899; bottom: -10%; right: -10%; animation-delay: -5s; }
      .blob-3 { width: 400px; height: 400px; background: #06b6d4; top: 40%; right: 20%; animation-delay: -10s; }
      @keyframes float { 
        0% { transform: translate(0, 0) scale(1); } 
        100% { transform: translate(100px, 50px) scale(1.1); } 
      }

      /* ULTRA GLASS CLASSES */
      .glass-panel { 
        background: rgba(255, 255, 255, 0.45); 
        backdrop-filter: blur(var(--glass-blur)); 
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }
      .dark .glass-panel { 
        background: rgba(10, 10, 15, 0.6); 
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow : 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .dark .glass-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* 3D PERSPECTIVE CARD */
      .perspective-container { perspective: 1200px; }
      .tilt-card { 
        transform-style: preserve-3d; 
        transition: transform 0.15s ease-out; 
      }

      /* NEURAL DONUT LOADER */
      .neural-ring {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 10px solid transparent;
        border-top: 10px solid #8b5cf6;
        border-right: 10px solid #ec4899;
        animation: spin 1s linear infinite;
        position: relative;
        filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.6));
      }
      .neural-ring::after {
        content: ''; position: absolute; inset: 4px; border-radius: 50%;
        border: 6px solid transparent; border-bottom: 6px solid #06b6d4;
        animation: spin-reverse 2s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-zinc-50 dark:bg-[#020205] text-zinc-900 dark:text-zinc-100">
    <div class="aurora-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
